<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vereinskarte</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="kopf">
    <h1 class="kopf-titel">⚽ Vereinskarte</h1>
    <label class="feld">
      <span>Saison</span>
      <select id="saison-auswahl" aria-label="Saison auswählen"></select>
    </label>
    <label class="feld feld-suche">
      <span>Suche</span>
      <input id="suche" type="search" placeholder="Verein oder Stadt …" autocomplete="off">
    </label>
    <div id="liga-filter" class="liga-filter" aria-label="Ligen ein- und ausblenden"></div>
  </header>

  <main class="hauptbereich">
    <div id="karte" aria-label="Karte der Vereine"></div>
    <aside id="seitenleiste" class="seitenleiste" aria-live="polite" hidden>
      <button id="seitenleiste-zu" class="schliessen" aria-label="Seitenleiste schließen">×</button>
      <div id="seitenleiste-inhalt"></div>
    </aside>
  </main>

  <!-- Bibliotheken liegen lokal in vendor/, damit die Seite auch offline per Doppelklick läuft -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <!-- Daten: Länder-Stammdaten und Saison-Index. Die Saisondatei selbst wird dynamisch nachgeladen. -->
  <script src="js/register.js"></script>
  <script src="data/laender.js"></script>
  <script src="data/saisons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
